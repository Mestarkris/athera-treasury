# Athera Treasury policy.
# Humans edit this file through git only. Agents read it and can never write it.
# Every policy check records `version` and the SHA-256 of this file's exact bytes.
# Amounts are decimal strings in whole tokens; the engine converts them with `decimals`.

version: 2
network: mainnet          # NEAR Intents has no testnet; see docs/decisions.md D1
verifier: intents.near

# Global kill switch. true = every check blocks and nothing is signed or submitted.
kill_switch: false

assets:
  - id: nep141:wrap.near
    symbol: wNEAR
    decimals: 24

approved:
  chains: [near]
  assets: [nep141:wrap.near]
  protocols: [intents.near]

accounts:
  treasury: mestarkris2.near   # client DAO treasury balance inside intents.near
  revenue: 21dc5310233beb595c6da40fe79b8d913a3cbdb04fb4ac14116f6c80c7b8fd3c  # implicit account; see docs/decisions.md D10

limits:
  inference_spend_per_day_usd: "1.00"
  capital_movement:
    nep141:wrap.near:
      per_tx: "0.05"
      per_day: "0.20"

risk:
  max_drawdown_pct: 50     # treasury may not fall more than this below today's peak
  min_reserve:
    nep141:wrap.near: "0.10"

fees:
  fee_bps: 100             # 1% of the settled principal
  min_fee:
    nep141:wrap.near: "0.0001"

revenue_split:             # percentages of each collected fee; must sum to 100
  - account: athera-ops.mestarkris2.near
    label: operations
    pct: 70
  - account: athera-reserve.mestarkris2.near
    label: reserve
    pct: 30

counterparties:            # the only accounts client capital may be sent to
  - account: athera-vendor.mestarkris2.near
    role: vendor
    label: Demo vendor

agents:                    # which proposal kinds each agent may originate
  treasury: [transfer]
  accounting: [fee, revenue_split]
  procurement: [vendor_payment]
  sales: []
